# PRODUCTION. Both containers use the server's own network, so "localhost" inside them is the
# server: the website listens on 127.0.0.1:5185, the API on 127.0.0.1:8195, and the database is the
# PostgreSQL server on this machine (DB_URL=jdbc:postgresql://localhost:5432/...). Set DB_URL,
# DB_USER and DB_PASSWORD in .env. The server's nginx (HTTPS) forwards the website address to 5185.
# Serve it behind HTTPS (a reverse proxy or load balancer with a certificate): the microphone and the
# live meeting in Part 3 only work on a secure (https://) address.
#
#   docker compose up -d --build
services:
  backend:
    build: ./backend
    restart: unless-stopped
    network_mode: host
    environment:
      SERVER_ADDRESS: 127.0.0.1
      SERVER_PORT: 8195
      SPRING_DATASOURCE_URL: ${DB_URL:?Set DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:?Set DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:?Set AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:?Set AZURE_CLIENT_ID}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET}
      APP_ADMIN_EMAILS: ${APP_ADMIN_EMAILS:?Set APP_ADMIN_EMAILS}
      APP_ALLOWED_DOMAINS: ${APP_ALLOWED_DOMAINS:-cloudfuze.com}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:?Set APP_CORS_ORIGINS to the site address}
      APP_MARKS_TEAMS: ${APP_MARKS_TEAMS:-20}
      APP_MARKS_EMAIL: ${APP_MARKS_EMAIL:-35}
      APP_MARKS_MEETING: ${APP_MARKS_MEETING:-45}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_SCORING_MODEL: ${OPENAI_SCORING_MODEL:-gpt-4o}
      OPENAI_MEETING_MODEL: ${OPENAI_MEETING_MODEL:-gpt-realtime}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_AZURE_TENANT_ID: ${AZURE_TENANT_ID}
        VITE_AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
    restart: unless-stopped
    network_mode: host
    depends_on: [backend]
